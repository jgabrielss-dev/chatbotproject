project_id = "chatbotproject"

[api]
enabled = false
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
database_encoding = "UTF8"
pooler = { enabled = false }

[auth]
enabled = false
site_url = ""
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[storage]
enabled = false
file_size_limit = "50MiB"

[functions.inbox]
# A Meta e o Telegram chamam esta função sem Authorization: não são usuários do
# projeto e não podem enviar JWT. Com o padrão do Supabase (`verify_jwt =
# true`) todo POST devolvia 401 e o canal oficial não recebia mensagem
# nenhuma. A autenticação do webhook é o segredo na própria URL, conferida
# dentro da função — ver `verificarSegredo` em `index.ts`.
verify_jwt = false

[secrets]
# nenhum segredo nesta fase (sem cobrança)