services:
  - type: web
    name: chatbotproject
    runtime: python
    buildCommand: pip install -r deploy/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      # Base das Edge Functions do Supabase: e o webhook publico dos canais
      # OFICIAIS da Meta (whatsapp_oficial / instagram_oficial). Sem isso o
      # app nao consegue mostrar a URL para cadastrar no painel da Meta.
      - key: SUPABASE_FUNCTIONS_BASE
        sync: false
      # Só usado pelo canal NÃO-oficial (Evolution/Baileys). Acima de 900s o
      # Render hiberna entre os pings e economiza as 750h/mês do plano gratis.
      - key: EVOLUTION_KEEPALIVE_SEG
        value: "1800"
      # OPCAO. Se definido, todas as rotas /api/* exigem o header X-Admin-Token.
      # Se ficar VAZIO o painel fica aberto (sem login), que e o padrao atual.
      - key: ADMIN_TOKEN
        value: ""
