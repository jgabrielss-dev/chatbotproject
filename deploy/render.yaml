services:
  - type: web
    name: chatbotproject
    runtime: python
    buildCommand: pip install -r deploy/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      # Sem este token todas as rotas /api/* ficam fechadas (503).
      - key: ADMIN_TOKEN
        sync: false
