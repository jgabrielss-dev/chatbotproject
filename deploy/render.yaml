services:
  - type: web
    name: chatbotproject
    runtime: python
    buildCommand: pip install -r deploy/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # Contas: o navegador fala com o GoTrue usando a anon key e a API valida
      # o JWT. Sem as duas, tudo em /api/* responde 503 e o painel nao abre.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: BASE_URL
        sync: false
      # Base das Edge Functions do Supabase: e o webhook publico dos canais
      # OFICIAIS da Meta (whatsapp_oficial / instagram_oficial). Sem isso o
      # app nao consegue mostrar a URL para cadastrar no painel da Meta.
      - key: SUPABASE_FUNCTIONS_BASE
        sync: false
      # Só usado pelo canal NÃO-oficial (Evolution/Baileys). Acima de 900s o
      # Render hiberna entre os pings e economiza as 750h/mês do plano gratis.
      - key: EVOLUTION_KEEPALIVE_SEG
        value: "1800"
      # Canais nao-oficiais sao restritos ao admin por padrao (ver
      # app/main.py::_exigir_tipo_permitido). "1" libera para o cliente.
      - key: CANAIS_NAO_OFICIAIS_PARA_USUARIOS
        value: "0"
      # SOMENTE para recuperar o acesso se o Supabase Auth cair. O login normal
      # e a conta do Supabase; isto e um breaks-glass, entao fica vazio.
      - key: ADMIN_TOKEN
        value: ""
